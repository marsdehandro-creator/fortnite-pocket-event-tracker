<!doctype html>
<html lang="en-ZA">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Fortnite Pocket Event Tracker</title>
    <meta
      name="description"
      content="Track Fortnite maintenance, update downtime, tournaments, cash cups, FNCS events, and competitive schedules in South African time."
    />
    <meta name="keywords" content="Fortnite downtime, Fortnite update time SAST, Fortnite maintenance South Africa, Fortnite tournaments, Cash Cup, FNCS, Victory Cup, Fortnite server status, best Fortnite landing spots, Fortnite POI rankings, Fortnite secrets, Fortnite map changes" />
    <meta name="theme-color" content="#05060a" />
    <meta name="color-scheme" content="dark" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="%VITE_SITE_URL%" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Fortnite Pocket Event Tracker" />
    <meta property="og:title" content="Fortnite Pocket Event Tracker" />
    <meta
      property="og:description"
      content="Track Fortnite maintenance, update downtime, tournaments, cash cups, FNCS events, and competitive schedules in South African time."
    />
    <meta property="og:url" content="%VITE_SITE_URL%" />
    <meta property="og:locale" content="en_ZA" />
    <meta property="og:image" content="%VITE_SITE_URL%og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Fortnite Pocket Event Tracker — update downtime and tournament countdowns in SAST" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Fortnite Pocket Event Tracker" />
    <meta
      name="twitter:description"
      content="Track Fortnite maintenance, update downtime, tournaments, cash cups, FNCS events, and competitive schedules in South African time."
    />
    <meta name="twitter:image" content="%VITE_SITE_URL%og-image.png" />

    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- iPhone/iPad home-screen app: full-screen launch and its label under the icon -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Pocket Tracker" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap"
    />

    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@graph": [
          {
            "@type": "WebSite",
            "name": "Fortnite Pocket Event Tracker",
            "url": "%VITE_SITE_URL%",
            "inLanguage": "en-ZA",
            "description": "Track Fortnite maintenance, update downtime, tournaments, cash cups, FNCS events, and competitive schedules in South African time."
          },
          {
            "@type": "WebApplication",
            "name": "Fortnite Pocket Event Tracker",
            "url": "%VITE_SITE_URL%",
            "applicationCategory": "GameApplication",
            "operatingSystem": "Any",
            "browserRequirements": "Requires JavaScript",
            "offers": { "@type": "Offer", "price": "0", "priceCurrency": "ZAR" },
            "audience": { "@type": "Audience", "geographicArea": { "@type": "Country", "name": "South Africa" } }
          }
        ]
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <noscript>
      <main style="max-width: 640px; margin: 48px auto; padding: 0 16px; font-family: system-ui, sans-serif; color: #eef0f7">
        <h1>Fortnite Pocket Event Tracker</h1>
        <p>
          Track Fortnite updates, downtime, maintenance windows, tournaments, cups, and competitive events in South
          African time. Live countdowns need JavaScript — please enable it to use the tracker.
        </p>
      </main>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
